// ─── Temperature conversion ─────────────────────────────────────────────────
function tempToC(val, from) {
  if (from === 'c') return val;
  if (from === 'f') return (val - 32) * 5 / 9;
  if (from === 'k') return val - 273.15;
}
function cToTemp(c, to) {
  if (to === 'c') return c;
  if (to === 'f') return c * 9 / 5 + 32;
  if (to === 'k') return c + 273.15;
}

// ─── State ───────────────────────────────────────────────────────────────────
let activeCat = 'length';

// ─── Init ────────────────────────────────────────────────────────────────────
function init() {
  const catsEl = document.getElementById('cats');
  Object.keys(CATS).forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (key === activeCat ? ' active' : '');
    btn.textContent = CATS[key].label;
    btn.onclick = () => selectCat(key);
    catsEl.appendChild(btn);
  });
  selectCat(activeCat);
}

function selectCat(cat) {
  activeCat = cat;
  document.querySelectorAll('.cat-btn').forEach((b, i) => {
    b.classList.toggle('active', Object.keys(CATS)[i] === cat);
  });
  const data = CATS[cat];
  const fromSel = document.getElementById('fromUnit');
  const toSel = document.getElementById('toUnit');
  fromSel.innerHTML = Object.keys(data.units).map(k =>
    `<option value="${k}">${data.units[k].label}</option>`).join('');
  toSel.innerHTML = Object.keys(data.units).map(k =>
    `<option value="${k}">${data.units[k].label}</option>`).join('');

  // sensible defaults per category
  const defaults = {
    length:['cm','in'], weight:['kg','lb'], temperature:['c','f'],
    area:['m2','ft2'], volume:['l','gal'], speed:['kmh','mph'],
    data:['gb','mb'], time:['hr','min']
  };
  if (defaults[cat]) {
    fromSel.value = defaults[cat][0];
    toSel.value   = defaults[cat][1];
  }

  document.getElementById('fromVal').value = '1';
  renderRefs(cat);
  renderSeo(cat);
  convert();
}

function convert() {
  const cat  = activeCat;
  const from = document.getElementById('fromUnit').value;
  const to   = document.getElementById('toUnit').value;
  const raw  = document.getElementById('fromVal').value;
  const val  = parseFloat(raw);

  if (raw === '' || isNaN(val)) {
    document.getElementById('toVal').value = '';
    document.getElementById('formulaBox').innerHTML = '';
    return;
  }

  let result;
  if (CATS[cat].special) {
    // Temperature: non-linear, use formula functions
    const celsius = tempToC(val, from);
    result = cToTemp(celsius, to);
  } else {
    const baseVal = val * CATS[cat].units[from].m;
    result = baseVal / CATS[cat].units[to].m;
  }

  // Format: avoid scientific notation for reasonable numbers
  const fmt = n => {
    if (n === 0) return '0';
    const abs = Math.abs(n);
    if (abs >= 1e12 || (abs < 1e-6 && abs > 0)) return n.toExponential(4);
    if (abs >= 1000) return parseFloat(n.toPrecision(7)).toLocaleString('en-IN');
    return parseFloat(n.toPrecision(7)).toString();
  };

  document.getElementById('toVal').value = fmt(result);

  // Formula display
  const fromLabel = CATS[cat].units[from].label;
  const toLabel   = CATS[cat].units[to].label;
  let formula = '';
  if (CATS[cat].special) {
    const fmap = { c:'°C', f:'°F', k:'K' };
    if (from === 'c' && to === 'f') formula = `°F = (°C × 9/5) + 32`;
    else if (from === 'f' && to === 'c') formula = `°C = (°F − 32) × 5/9`;
    else if (from === 'c' && to === 'k') formula = `K = °C + 273.15`;
    else if (from === 'k' && to === 'c') formula = `°C = K − 273.15`;
    else if (from === 'f' && to === 'k') formula = `K = (°F − 32) × 5/9 + 273.15`;
    else if (from === 'k' && to === 'f') formula = `°F = (K − 273.15) × 9/5 + 32`;
    else formula = `${fmap[from]} → ${fmap[to]}`;
  } else {
    const ratio = CATS[cat].units[from].m / CATS[cat].units[to].m;
    const rFmt = parseFloat(ratio.toPrecision(6));
    formula = `1 ${fromLabel.split(' ')[0]} = ${rFmt} ${toLabel.split(' ')[0]}`;
  }
  document.getElementById('formulaBox').innerHTML = `<strong>Formula:</strong> ${formula}`;
}

function swapUnits() {
  const fromSel = document.getElementById('fromUnit');
  const toSel   = document.getElementById('toUnit');
  const fromVal = document.getElementById('fromVal');
  const toVal   = document.getElementById('toVal');
  const tmpUnit = fromSel.value;
  fromSel.value = toSel.value;
  toSel.value   = tmpUnit;
  fromVal.value = toVal.value || fromVal.value;
  convert();
}

function renderRefs(cat) {
  const refs = CATS[cat].refs;
  const grid = document.getElementById('refGrid');
  grid.innerHTML = refs.map(r =>
    `<div class="ref-item" onclick="setFromRef(${JSON.stringify(r)})">
      <span>${r.a} ${r.u}</span> = ${r.b} ${r.v}
    </div>`
  ).join('');
}

function setFromRef(r) {
  // find the unit key matching the 'from' label fragment
  document.getElementById('fromVal').value = r.a;
  convert();
}

function renderSeo(cat) {
  document.getElementById('seoBox').innerHTML = CATS[cat].seo || '';
}

init();
</script>
